<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestroPOS — Role-Based Restaurant Management System</title>
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #0d1117;
      --bg-card: #111827;
      --bg-input: #1a1f2e;
      --bg-hover: #1f293d;
      --border-color: #1e293b;
      --border-subtle: #162032;

      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #06b6d4;

      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: #242f45;
      border-radius: 4px;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-logo {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
    }

    .logo-title {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .nav-label {
      padding: 14px 20px 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-link:hover {
      color: #f1f5f9;
      background-color: rgba(255, 255, 255, 0.03);
    }

    .nav-link.active {
      color: var(--primary);
      background-color: rgba(59, 130, 246, 0.08);
      border-left-color: var(--primary);
      font-weight: 600;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }

    /* Main Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      height: 62px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .role-switcher-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-input);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .role-switch-select {
      background: transparent;
      color: var(--text-primary);
      border: none;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .role-badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .role-ADMIN {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .role-MANAGER {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .role-WAITER {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .role-CHEF {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .role-CASHIER {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* UI Components */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .badge-pending {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .badge-preparing {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-ready {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-served {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .badge-completed {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .badge-cancelled {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .badge-available {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .badge-occupied {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .badge-reserved {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
    }

    .badge-cleaning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .data-table th {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      background: rgba(13, 17, 23, 0.6);
    }

    .data-table td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .data-table tr:hover td {
      background: rgba(30, 41, 59, 0.25);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-foot {
      padding: 16px 22px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Access Denied Card */
    .access-denied-box {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      max-width: 520px;
      margin: 40px auto;
    }

    /* Thermal Receipt */
    .receipt-print {
      background: #fff;
      color: #000;
      padding: 24px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .receipt-center {
      text-align: center;
      border-bottom: 1px dashed #777;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin: 3px 0;
    }

    .receipt-tot {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 15px;
      border-top: 2px solid #000;
      margin-top: 8px;
      padding-top: 6px;
    }

    /* Toast */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      animation: slideIn 0.25s ease;
    }

    .toast-success {
      background: #065f46;
      border: 1px solid #10b981;
    }

    .toast-error {
      background: #7f1d1d;
      border: 1px solid #ef4444;
    }

    .toast-info {
      background: #1e3a8a;
      border: 1px solid #3b82f6;
    }

    .toast-warning {
      background: #78350f;
      border: 1px solid #f59e0b;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>

          created_at: new Date(Date.now() - 300000).toISOString(),
          user_name: 'Rahul (Waiter)',
          items: [
            { item_id: 9, item_name: 'Hyderabadi Chicken Biryani', quantity: 1, unit_price: 299.00, subtotal: 299.00, specialNotes: 'Double raita' },
            { item_id: 10, item_name: 'Mango Lassi', quantity: 1, unit_price: 99.00, subtotal: 99.00, specialNotes: 'Cold' }
          ]
        }
      ],
      payments: [
        {
          id: 1,
          order_id: 101,
          amount: 835.80,
          tipAmount: 20.00,
          method: 'UPI',
          status: 'COMPLETED',
          transactionReference: 'UPI-RESTRO-998811',
          created_at: new Date(Date.now() - 3000000).toISOString()
        }
      ]
    };

    function getStore() {
      const data = localStorage.getItem('restropos_db_v2');
      if (!data) {
        localStorage.setItem('restropos_db_v2', JSON.stringify(DEFAULT_DATA));
        return DEFAULT_DATA;
      }
      return JSON.parse(data);
    }

    function saveStore(store) {
      localStorage.setItem('restropos_db_v2', JSON.stringify(store));
      updateRoleUI();
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    // =========================================================================
    // ROLE SWITCHING & DYNAMIC SIDEBAR
    // =========================================================================
    function switchRole(role) {
      const store = getStore();
      store.activeRole = role;
      saveStore(store);

      const badge = document.getElementById('role-badge-display');
      badge.className = `role-badge role-${role}`;
      badge.innerText = role;

      showToast(`Switched active role to ${role}`, 'info');

      // If current page is restricted for this new role, redirect to dashboard or first allowed page
      const perms = ROLE_PERMISSIONS[role];
      if (!perms.pages.includes(currentPage)) {
        currentPage = perms.pages[0] || 'dashboard';
      }

      updateRoleUI();
    }

    function updateRoleUI() {
      const store = getStore();
      const role = store.activeRole || 'ADMIN';
      const perms = ROLE_PERMISSIONS[role];

      // Update role select and badge
      const roleSelect = document.getElementById('role-select');
      if (roleSelect) roleSelect.value = role;
      const roleBadge = document.getElementById('role-badge-display');
      if (roleBadge) {
        roleBadge.className = `role-badge role-${role}`;
        roleBadge.innerText = role;
      }

      // Re-generate Sidebar Navigation strictly showing ONLY permitted links!
      const navContainer = document.getElementById('sidebar-nav-container');
      const prepCount = store.orders.filter(o => o.status === 'PENDING' || o.status === 'PREPARING').length;
      const readyCount = store.orders.filter(o => o.status === 'READY').length;

      let navHtml = `<div class="nav-label">Navigation (${role})</div>`;

      if (perms.pages.includes('dashboard')) {
        navHtml += `<div class="nav-link ${currentPage === 'dashboard' ? 'active' : ''}" onclick="navigate('dashboard')">📊 Dashboard</div>`;
      }
      if (perms.pages.includes('pos')) {
        navHtml += `<div class="nav-link ${currentPage === 'pos' ? 'active' : ''}" onclick="navigate('pos')">➕ New Order (POS)</div>`;
      }
      if (perms.pages.includes('orders')) {
        navHtml += `<div class="nav-link ${currentPage === 'orders' ? 'active' : ''}" onclick="navigate('orders')">🛍️ Orders List</div>`;
      }
      if (perms.pages.includes('tables')) {
        navHtml += `<div class="nav-link ${currentPage === 'tables' ? 'active' : ''}" onclick="navigate('tables')">🪑 Floor Tables</div>`;
      }
      if (perms.pages.includes('menu')) {
        navHtml += `<div class="nav-link ${currentPage === 'menu' ? 'active' : ''}" onclick="navigate('menu')">📖 Menu Catalog</div>`;
      }
      if (perms.pages.includes('kitchen')) {
        navHtml += `<div class="nav-link ${currentPage === 'kitchen' ? 'active' : ''}" onclick="navigate('kitchen')">🍳 Kitchen KDS <span class="nav-badge badge-preparing">${prepCount}</span></div>`;
      }
      if (perms.pages.includes('cashier')) {
        navHtml += `<div class="nav-link ${currentPage === 'cashier' ? 'active' : ''}" onclick="navigate('cashier')">💵 Cashier Checkout <span class="nav-badge badge-ready">${readyCount}</span></div>`;
      }
      if (perms.pages.includes('reports')) {
        navHtml += `<div class="nav-link ${currentPage === 'reports' ? 'active' : ''}" onclick="navigate('reports')">📈 Sales Reports</div>`;
      }
      if (perms.pages.includes('users')) {
        navHtml += `<div class="nav-link ${currentPage === 'users' ? 'active' : ''}" onclick="navigate('users')">👥 Staff Directory</div>`;
      }

      navContainer.innerHTML = navHtml;

      const titles = {
        dashboard: 'Dashboard',
        pos: 'Point of Sale (POS) — New Order',
        orders: 'Orders Management',
        tables: 'Restaurant Floor & Table Status',
        menu: 'Menu Catalog & Categories',
        kitchen: 'Kitchen Display System (KDS)',
        cashier: 'Cashier Checkout & Billing',
        reports: 'Sales Analytics & Reports',
        users: 'Staff & Role Management'
      };
      document.getElementById('current-page-title').innerText = titles[currentPage] || 'RestroPOS';

      renderCurrentPage();
    }

    let currentPage = 'dashboard';

    function navigate(page) {
      const store = getStore();
      const perms = ROLE_PERMISSIONS[store.activeRole];

      if (!perms.pages.includes(page)) {
        showToast(`Access Denied: Your role (${store.activeRole}) cannot access this section.`, 'error');
        renderAccessDenied(document.getElementById('page-content'), page, store.activeRole);
        return;
      }

      currentPage = page;
      updateRoleUI();
    }

    function renderAccessDenied(container, attemptedPage, role) {
      container.innerHTML = `
        <div class="access-denied-box">
          <div style="font-size: 56px; margin-bottom: 16px;">🚫</div>
          <h2 style="color: #ef4444; margin-bottom: 8px;">Access Denied</h2>
          <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">
            The <strong>${attemptedPage.toUpperCase()}</strong> section is restricted.<br>
            Your active role <strong>${role}</strong> does not possess clearance for this attribute.
          </p>
          <button class="btn btn-primary" onclick="navigate('${ROLE_PERMISSIONS[role].pages[0] || 'dashboard'}')">
            Return to Allowed Workspace
          </button>
        </div>
      `;
    }

    function renderCurrentPage() {
      const main = document.getElementById('page-content');
      const store = getStore();
      const perms = ROLE_PERMISSIONS[store.activeRole];

      if (!perms.pages.includes(currentPage)) {
        renderAccessDenied(main, currentPage, store.activeRole);
        return;
      }

      if (currentPage === 'dashboard') renderDashboard(main, store, perms);
      else if (currentPage === 'pos') renderPOS(main, store, perms);
      else if (currentPage === 'orders') renderOrders(main, store, perms);
      else if (currentPage === 'tables') renderTables(main, store, perms);
      else if (currentPage === 'menu') renderMenu(main, store, perms);
      else if (currentPage === 'kitchen') renderKitchen(main, store, perms);
      else if (currentPage === 'cashier') renderCashier(main, store, perms);
      else if (currentPage === 'reports') renderReports(main, store, perms);
      else if (currentPage === 'users') renderUsers(main, store, perms);
    }

    // =========================================================================
    // 1. DASHBOARD (Role-aware KPIs: Revenue hidden from Waiters/Chefs)
    // =========================================================================
    function renderDashboard(container, store, perms) {
      const todaySales = store.orders.filter(o => o.status === 'COMPLETED').reduce((s, o) => s + o.total_amount, 0);
      const totalOrders = store.orders.length;
      const activeOrders = store.orders.filter(o => ['PENDING', 'PREPARING', 'READY', 'SERVED'].includes(o.status)).length;
      const occupiedTables = store.tables.filter(t => t.status === 'occupied').length;
      const availableTables = store.tables.filter(t => t.status === 'available').length;

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px;">
          ${perms.canViewSales ? `
            <div class="card" style="border-left: 4px solid var(--success);">
              <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Today's Revenue (getDailySales)</div>
              <div style="font-size: 26px; font-weight: 800; color: #10b981; margin-top: 6px;">₹${todaySales.toFixed(2)}</div>
              <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Completed orders revenue</div>
            </div>
          ` : `
            <div class="card" style="border-left: 4px solid var(--text-muted);">
              <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Financial Access</div>
              <div style="font-size: 18px; font-weight: 700; color: var(--text-muted); margin-top: 8px;">🔒 Restricted for ${store.activeRole}</div>
              <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Visible to Admin & Cashier only</div>
            </div>
          `}
          <div class="card" style="border-left: 4px solid var(--primary);">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Total Orders (getOrderCount)</div>
            <div style="font-size: 26px; font-weight: 800; color: #60a5fa; margin-top: 6px;">${totalOrders}</div>
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Recorded tickets</div>
          </div>
          <div class="card" style="border-left: 4px solid var(--warning);">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Active Kitchen Orders</div>
            <div style="font-size: 26px; font-weight: 800; color: #fbbf24; margin-top: 6px;">${activeOrders}</div>
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">In preparation or ready</div>
          </div>
          <div class="card" style="border-left: 4px solid #8b5cf6;">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Occupied Tables (getActiveTables)</div>
            <div style="font-size: 26px; font-weight: 800; color: #a78bfa; margin-top: 6px;">${occupiedTables} / ${store.tables.length}</div>
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">${availableTables} tables currently open</div>
          </div>
        </div>

        <!-- Role Quick Actions -->
        <div style="margin-bottom: 24px;">
          <div style="font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;">
            Authorized Actions for ${store.activeRole}:
          </div>
          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            ${perms.canTakeOrders ? '<button class="btn btn-primary" onclick="navigate(\'pos\')">➕ Take New POS Order</button>' : ''}
            ${perms.canPrepareOrders ? '<button class="btn btn-secondary" onclick="navigate(\'kitchen\')">🍳 Open Kitchen KDS</button>' : ''}
            ${perms.canCheckout ? '<button class="btn btn-secondary" onclick="navigate(\'cashier\')">💵 Process Cashier Checkout</button>' : ''}
            ${perms.pages.includes('tables') ? '<button class="btn btn-secondary" onclick="navigate(\'tables\')">🪑 View Dining Room Floor</button>' : ''}
          </div>
        </div>

        <!-- Recent Activity Log -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="padding: 16px 20px; font-weight: 700; font-size: 16px; border-bottom: 1px solid var(--border-color);">
            Recent Order Activity Log
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Type</th>
                <th>Table</th>
                <th>Items Summary</th>
                ${perms.canViewSales ? '<th>Total</th>' : ''}
                <th>Status</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody>
              ${store.orders.slice().reverse().slice(0, 5).map(o => `
                <tr>
                  <td style="font-weight: 700;">#${o.id}</td>
                  <td style="text-transform: capitalize; color: ${o.order_type === 'DINE_IN' ? '#60a5fa' : '#a78bfa'}">${o.order_type}</td>
                  <td>${o.table_number ? 'Table #' + o.table_number : '—'}</td>
                  <td>${o.items.map(i => i.quantity + 'x ' + i.item_name).join(', ')}</td>
                  ${perms.canViewSales ? `<td style="font-weight: 700; color: #10b981;">₹${o.total_amount.toFixed(2)}</td>` : ''}
                  <td><span class="badge badge-${o.status.toLowerCase()}">${o.status}</span></td>
                  <td style="color: var(--text-muted); font-size: 12px;">${new Date(o.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 2. POS / NEW ORDER (Restricted to WAITER, ADMIN, MANAGER)
    // =========================================================================
    let posCart = [];
    let posCategoryFilter = 'all';
    let posOrderType = 'DINE_IN';
    let posSelectedTable = 1;
    let posSpecialInstructions = '';

    function renderPOS(container, store, perms) {
      if (!perms.canTakeOrders) {
        renderAccessDenied(container, 'pos', store.activeRole);
        return;
      }

      const filtered = store.menuItems.filter(i => posCategoryFilter === 'all' || i.category_id === Number(posCategoryFilter));
      const subtotal = posCart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const tax = Number((subtotal * 0.05).toFixed(2)); // 5% GST
      const totalAmount = Number((subtotal + tax).toFixed(2));

      container.innerHTML = `
        <div style="display: flex; gap: 20px; height: calc(100vh - 120px);">
          <!-- Left: Menu Grid -->
          <div class="card" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border-color);">
              <button class="btn ${posCategoryFilter === 'all' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setPosCat('all')">All Items</button>
              ${store.categories.map(c => `
                <button class="btn ${posCategoryFilter == c.id ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setPosCat(${c.id})">${c.name}</button>
              `).join('')}
            </div>

            <div style="flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;">
              ${filtered.map(item => `
                <div class="card" style="padding: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; border-color: #242f45; opacity: ${item.available ? 1 : 0.5};" onclick="${item.available ? `posAddToCart(${item.id})` : ''}">
                  <div>
                    <div style="font-weight: 700; font-size: 14px;">${item.name}</div>
                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${item.description || item.category_name}</div>
                    <div style="font-size: 11px; color: #fbbf24; margin-top: 4px;">⏱️ ${item.prepTimeMinutes || 15} mins</div>
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
                    <span style="font-weight: 800; color: #10b981; font-size: 15px;">₹${item.price.toFixed(2)}</span>
                    ${item.available ? '<span class="btn btn-primary btn-sm" style="padding: 3px 8px;">+ Add</span>' : '<span style="color: #ef4444; font-size: 11px; font-weight: 700;">Sold Out</span>'}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Right: Cart & Review -->
          <div class="card" style="width: 400px; display: flex; flex-direction: column;">
            <div style="font-weight: 700; font-size: 16px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);">Current Order Ticket</div>

            <!-- Order Type: DINE_IN, TAKEAWAY, DELIVERY -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px;">
              <button class="btn ${posOrderType === 'DINE_IN' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setPosType('DINE_IN')">🍽️ Dine-In</button>
              <button class="btn ${posOrderType === 'TAKEAWAY' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setPosType('TAKEAWAY')">🛍️ Takeaway</button>
              <button class="btn ${posOrderType === 'DELIVERY' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setPosType('DELIVERY')">🛵 Delivery</button>
            </div>

            ${posOrderType === 'DINE_IN' ? `
              <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Assign Table:</label>
                <select class="select" onchange="posSelectedTable = Number(this.value)">
                  ${store.tables.map(t => `
                    <option value="${t.table_number}" ${posSelectedTable == t.table_number ? 'selected' : ''}>Table #${t.table_number} (${t.capacity} seats • ${t.locationZone}) - [${t.status}]</option>
                  `).join('')}
                </select>
              </div>
            ` : ''}

            <!-- Cart Items with specialNotes -->
            <div style="flex: 1; overflow-y: auto; border-top: 1px solid var(--border-subtle); padding: 8px 0;">
              ${posCart.length === 0 ? `
                <div style="text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 13px;">Cart is empty. Tap menu items to add.</div>
              ` : posCart.map(i => `
                <div style="padding: 6px 0; border-bottom: 1px solid var(--border-subtle);">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                      <div style="font-weight: 600; font-size: 13px;">${i.name}</div>
                      <div style="font-size: 11px; color: var(--text-muted);">₹${i.price.toFixed(2)} each</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                      <button class="btn btn-secondary btn-sm" style="padding: 2px 7px;" onclick="posChangeQty(${i.id}, -1)">-</button>
                      <span style="font-weight: 700; width: 16px; text-align: center;">${i.quantity}</span>
                      <button class="btn btn-secondary btn-sm" style="padding: 2px 7px;" onclick="posChangeQty(${i.id}, 1)">+</button>
                      <span style="font-weight: 700; color: #10b981; min-width: 50px; text-align: right;">₹${(i.price * i.quantity).toFixed(2)}</span>
                    </div>
                  </div>
                  <input type="text" class="input" style="padding: 4px 8px; font-size: 11px; margin-top: 4px;" placeholder="Item note (e.g., less spicy)..." value="${i.specialNotes || ''}" onchange="posSetItemNote(${i.id}, this.value)">
                </div>
              `).join('')}
            </div>

            <!-- Special Instructions -->
            <div style="margin-top: 8px;">
              <input type="text" class="input" placeholder="Overall Special Instructions for Kitchen..." value="${posSpecialInstructions}" onchange="posSpecialInstructions = this.value">
            </div>

            <!-- Subtotal, Tax, Total -->
            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 8px;">
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 2px;">
                <span>Subtotal:</span><span>₹${subtotal.toFixed(2)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">
                <span>GST (5%):</span><span>₹${tax.toFixed(2)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin-bottom: 12px;">
                <span>Total Bill:</span><span style="color: #10b981;">₹${totalAmount.toFixed(2)}</span>
              </div>
              <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;" onclick="posPromptConfirm()" ${posCart.length === 0 ? 'disabled' : ''}>
                Review & Confirm Order
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function setPosCat(c) { posCategoryFilter = c; renderCurrentPage(); }
    function setPosType(t) { posOrderType = t; renderCurrentPage(); }
    function posAddToCart(itemId) {
      const store = getStore();
      const item = store.menuItems.find(i => i.id === itemId);
      if (!item) return;
      const exist = posCart.find(i => i.id === itemId);
      if (exist) exist.quantity++;
      else posCart.push({ id: item.id, name: item.name, price: item.price, quantity: 1, specialNotes: '' });
      renderCurrentPage();
    }
    function posChangeQty(itemId, delta) {
      const exist = posCart.find(i => i.id === itemId);
      if (!exist) return;
      exist.quantity += delta;
      if (exist.quantity <= 0) posCart = posCart.filter(i => i.id !== itemId);
      renderCurrentPage();
    }
    function posSetItemNote(itemId, note) {
      const exist = posCart.find(i => i.id === itemId);
      if (exist) exist.specialNotes = note;
    }

    function posPromptConfirm() {
      const subtotal = posCart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const tax = Number((subtotal * 0.05).toFixed(2));
      const totalAmount = Number((subtotal + tax).toFixed(2));

      const modal = document.getElementById('modal-root');
      modal.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <div class="modal-head">
              <h3 style="font-size: 16px; font-weight: 700;">Review Order Confirmation</h3>
              <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
              <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
                Type: <strong>${posOrderType}</strong> ${posOrderType === 'DINE_IN' ? '• Assigned to Table #' + posSelectedTable : ''}
              </p>
              <div style="background: var(--bg-input); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
                ${posCart.map(i => `
                  <div style="display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0;">
                    <span>${i.quantity}x ${i.name} ${i.specialNotes ? `<small style="color: #fbbf24;">(${i.specialNotes})</small>` : ''}</span>
                    <strong>₹${(i.price * i.quantity).toFixed(2)}</strong>
                  </div>
                `).join('')}
                <div style="border-top: 1px solid var(--border-color); margin-top: 8px; padding-top: 6px; font-size: 12px; display: flex; justify-content: space-between;">
                  <span>Subtotal + GST (5%):</span><span>₹${totalAmount.toFixed(2)}</span>
                </div>
              </div>
              ${posSpecialInstructions ? `<div style="font-size: 12px; color: #fbbf24; margin-bottom: 8px;">Kitchen Note: "${posSpecialInstructions}"</div>` : ''}
              <p style="font-size: 12px; color: var(--text-muted);">
                Selecting <strong>"No, Edit"</strong> returns to the ticket without creating an order.<br>
                Selecting <strong>"Yes, Send to Kitchen"</strong> creates the order and updates table status.
              </p>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="closeModal()">No, Back to Edit</button>
              <button class="btn btn-success" onclick="posCommitOrder()">Yes, Confirm & Send to Kitchen</button>
            </div>
          </div>
        </div>
      `;
    }

    function posCommitOrder() {
      const store = getStore();
      const subtotal = posCart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const tax = Number((subtotal * 0.05).toFixed(2));
      const totalAmount = Number((subtotal + tax).toFixed(2));
      const newOrderId = (store.orders[store.orders.length - 1]?.id || 100) + 1;

      const newOrder = {
        id: newOrderId,
        order_type: posOrderType,
        table_id: posOrderType === 'DINE_IN' ? posSelectedTable : null,
        table_number: posOrderType === 'DINE_IN' ? posSelectedTable : null,
        status: 'PENDING',
        subtotalAmount: subtotal,
        taxAmount: tax,
        discountAmount: 0.00,
        total_amount: totalAmount,
        specialInstructions: posSpecialInstructions,
        created_at: new Date().toISOString(),
        user_name: `${store.activeRole} User`,
        items: posCart.map(i => ({
          item_id: i.id,
          item_name: i.name,
          quantity: i.quantity,
          unit_price: i.price,
          subtotal: i.price * i.quantity,
          specialNotes: i.specialNotes || ''
        }))
      };

      if (posOrderType === 'DINE_IN') {
        const tbl = store.tables.find(t => t.table_number === posSelectedTable);
        if (tbl) tbl.status = 'occupied';
      }

      store.orders.push(newOrder);
      saveStore(store);

      posCart = [];
      posSpecialInstructions = '';
      closeModal();
      showToast(`Order #${newOrderId} sent to kitchen as PENDING!`, 'success');
      navigate('orders');

                  ${o.specialInstructions ? `<div style="color: #fbbf24; font-size: 11px; margin-top: 4px;">⚠️ Note: ${o.specialInstructions}</div>` : ''}
                  <div style="margin: 8px 0; font-size: 13px;">

    function updateKitchenStatus(orderId, newStatus) {
      const store = getStore();

        saveStore(store);
        showToast(`Order #${orderId} moved to ${newStatus}`, 'info');

    // =========================================================================
    // 4. CASHIER CHECKOUT (Restricted to CASHIER, ADMIN, MANAGER)
    // =========================================================================
    let cashierSelectedId = null;
    let cashierMethod = 'CASH'; // CASH, CARD, UPI, WALLET
    let cashierTip = 0;
    let cashierDiscount = 0;
    let cashierTxnRef = '';

    function renderCashier(container, store, perms) {
      if (!perms.canCheckout) {
        renderAccessDenied(container, 'cashier', store.activeRole);
        return;
      }

      const readyOrders = store.orders.filter(o => o.status === 'READY');

      const selected = store.orders.find(o => o.id === cashierSelectedId && o.status === 'READY');

      const billTotal = selected ? Number((selected.subtotalAmount + selected.taxAmount + Number(cashierTip) - Number(cashierDiscount)).toFixed(2)) : 0;

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 440px; gap: 20px; height: calc(100vh - 120px);">

          <div class="card" style="display: flex; flex-direction: column;">

                  ${readyOrders.map(o => `
                    <div class="card" style="padding: 14px; cursor: pointer; border-color: ${cashierSelectedId === o.id ? 'var(--primary)' : 'var(--border-color)'}; background: ${cashierSelectedId === o.id ? 'rgba(59, 130, 246, 0.08)' : 'var(--bg-card)'};" onclick="cashierSelectedId = ${o.id}; renderCurrentPage()">

                        <span>#${o.id}</span>
                        <span class="badge badge-ready">${o.status}</span>
                      </div>

                        ₹${o.total_amount.toFixed(2)}
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>

          <!-- Right: Billing Terminal -->
          <div class="card" style="display: flex; flex-direction: column;">
            ${selected ? `
              <div style="font-weight: 700; font-size: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px;">
                Bill Summary: Order #${selected.id}
              </div>
              <div style="flex: 1; overflow-y: auto; margin-bottom: 12px;">
                ${selected.items.map(i => `
                  <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0;">
                    <span>${i.quantity}x ${i.item_name}</span>
                    <span>₹${i.subtotal.toFixed(2)}</span>
                  </div>
                `).join('')}
              </div>

              <div style="background: var(--bg-input); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <span>Subtotal:</span><span>₹${selected.subtotalAmount.toFixed(2)}</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <span>Tax (5% GST):</span><span>₹${selected.taxAmount.toFixed(2)}</span>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
                  <div>
                    <label style="font-size: 11px; color: var(--text-muted);">Tip / Gratuity (₹):</label>
                    <input type="number" class="input" style="padding: 4px 8px; font-size: 12px;" value="${cashierTip}" onchange="cashierTip = Number(this.value); renderCurrentPage()">
                  </div>
                  <div>
                    <label style="font-size: 11px; color: var(--text-muted);">Discount (₹):</label>
                    <input type="number" class="input" style="padding: 4px 8px; font-size: 12px;" value="${cashierDiscount}" onchange="cashierDiscount = Number(this.value); renderCurrentPage()">
                  </div>
                </div>
              </div>

              <!-- Payment Method Selector: CASH, CARD, UPI, WALLET -->
              <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Payment Method:</label>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;">
                  <button class="btn ${cashierMethod === 'CASH' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="cashierMethod = 'CASH'; renderCurrentPage()">💵 Cash</button>
                  <button class="btn ${cashierMethod === 'CARD' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="cashierMethod = 'CARD'; renderCurrentPage()">💳 Card</button>
                  <button class="btn ${cashierMethod === 'UPI' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="cashierMethod = 'UPI'; renderCurrentPage()">📱 UPI</button>
                  <button class="btn ${cashierMethod === 'WALLET' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="cashierMethod = 'WALLET'; renderCurrentPage()">👛 Wallet</button>

              </div>

              <div style="margin-bottom: 14px;">
                <input type="text" class="input" style="font-size: 12px;" placeholder="Transaction Reference / Note (Optional)..." value="${cashierTxnRef}" onchange="cashierTxnRef = this.value">
              </div>

              <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 20px;">
                  <span>Payable Total:</span>
                  <span style="color: #10b981;">₹${billTotal.toFixed(2)}</span>
                </div>
              </div>

              <button class="btn btn-success" style="width: 100%; padding: 12px; font-size: 15px;" onclick="cashierExecuteCheckout(${selected.id}, ${billTotal})">
                Record Payment & Release Table
              </button>
            ` : '<div style="color: var(--text-muted); text-align: center; padding: 80px 10px;">Select an order from the left to checkout.</div>'}
          </div>
        </div>
      `;
    }

    function cashierExecuteCheckout(orderId, finalAmount) {
      const store = getStore();
      const o = store.orders.find(item => item.id === orderId);
      if (!o) return;

      o.status = 'COMPLETED';
      o.total_amount = finalAmount;
      o.discountAmount = Number(cashierDiscount);

      // Release table back to AVAILABLE
      if (o.table_id) {
        const tbl = store.tables.find(t => t.table_number === o.table_number);
        if (tbl) tbl.status = 'available';
      }

      // Record payment
      const pId = store.payments.length + 1;
      const ref = cashierTxnRef.trim() || `${cashierMethod}-TXN-${Math.floor(100000 + Math.random() * 900000)}`;
      store.payments.push({
        id: pId,
        order_id: o.id,
        amount: finalAmount,
        tipAmount: Number(cashierTip),
        method: cashierMethod,
        status: 'COMPLETED',
        transactionReference: ref,
        created_at: new Date().toISOString()
      });

      saveStore(store);
      showToast(`Payment recorded via ${cashierMethod}! Table released.`, 'success');

      // Thermal Receipt
      showReceiptModal(o, cashierMethod, ref);
      cashierSelectedId = null;
      cashierTxnRef = '';
      cashierTip = 0;
      cashierDiscount = 0;
      renderCurrentPage();
    }

    // =========================================================================
    // 5. MENU (Attributes restricted by role: Chef can only toggle stock; Admin can edit price & add/delete)

    function toggleAvailability(itemId) {
      const store = getStore();
      const item = store.menuItems.find(i => i.id === itemId);
      if (item) {
        item.available = !item.available;
        saveStore(store);
        showToast(`Stock updated for ${item.name}`, 'info');
        renderCurrentPage();
      }
    }

    function promptEditPrice(itemId) {
      const store = getStore();
      const perms = ROLE_PERMISSIONS[store.activeRole];
      if (!perms.canEditPrice) {
        showToast('Permission denied: Only Admin & Manager can update prices.', 'error');
        return;
      }
      const item = store.menuItems.find(i => i.id === itemId);
      if (!item) return;
      const newP = parseFloat(prompt(`Enter new price for ${item.name}:`, item.price));
      if (!isNaN(newP) && newP > 0) {
        item.price = newP;
        saveStore(store);
        showToast(`Price updated for ${item.name} to ₹${newP.toFixed(2)}`, 'success');
        renderCurrentPage();
      }
    }

    function deleteMenuItem(itemId) {
      const store = getStore();
      const perms = ROLE_PERMISSIONS[store.activeRole];
      if (!perms.canDeleteMenuItem) {
        showToast('Permission denied: Only Admin can delete menu items.', 'error');
        return;
      }
      store.menuItems = store.menuItems.filter(i => i.id !== itemId);
      saveStore(store);
      showToast('Item deleted from menu.', 'success');
      renderCurrentPage();
    }

    function promptAddItem() {
      const store = getStore();
      const perms = ROLE_PERMISSIONS[store.activeRole];
      if (!perms.canAddMenuItem) {
        showToast('Permission denied: Only Admin can create dishes.', 'error');

      const desc = prompt('Short Description:', 'Chef specialty recipe');

      store.menuItems.push({
        id: store.menuItems.length + 1,
        category_id: 1,
        category_name: 'Starters',
        name,
        price,
        description: desc,
        prepTimeMinutes: time,
        available: true,
        imageUrl: ''

      saveStore(store);
      showToast(`Added ${name} to catalog!`, 'success');
      renderCurrentPage();

        return;
      }
      const nextNum = Math.max(...store.tables.map(t => t.table_number), 0) + 1;
      const cap = parseInt(prompt(`Capacity for Table #${nextNum}:`, '4')) || 4;
      const zone = prompt(`Location Zone:`, 'Main Dining');
      store.tables.push({ id: store.tables.length + 1, table_number: nextNum, capacity: cap, locationZone: zone, status: 'available' });
      saveStore(store);
      showToast(`Added Table #${nextNum} to floor!`, 'success');
      renderCurrentPage();
    }

    // =========================================================================
    // 7. ORDERS LIST
    // =========================================================================
    function renderOrders(container, store, perms) {
      container.innerHTML = `
        <div class="card" style="padding: 0; overflow: hidden;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Type</th>
                <th>Table</th>
                <th>Items Ordered</th>
                ${perms.canViewSales ? '<th>Total Bill</th>' : ''}
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${store.orders.slice().reverse().map(o => `
                <tr>
                  <td style="font-weight: 700;">#${o.id}</td>
                  <td style="text-transform: capitalize;">${o.order_type}</td>
                  <td>${o.table_number ? 'Table #' + o.table_number : 'Takeaway'}</td>
                  <td>${o.items.map(i => i.quantity + 'x ' + i.item_name).join(', ')}</td>
                  ${perms.canViewSales ? `<td style="font-weight: 700; color: #10b981;">₹${o.total_amount.toFixed(2)}</td>` : ''}
                  <td><span class="badge badge-${o.status.toLowerCase()}">${o.status}</span></td>
                  <td>
                    ${o.status === 'COMPLETED' ? `<button class="btn btn-secondary btn-sm" onclick='showReceiptModal(${JSON.stringify(o)})'>🧾 Receipt</button>` : '—'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 8. REPORTS (Restricted to ADMIN, MANAGER, CASHIER)
    // =========================================================================
    function renderReports(container, store, perms) {
      if (!perms.canViewSales) {
        renderAccessDenied(container, 'reports', store.activeRole);
        return;
      }

      const totalRev = store.orders.filter(o => o.status === 'COMPLETED').reduce((s, o) => s + o.total_amount, 0);

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px;">
          <div class="card">
            <div style="font-size: 12px; color: var(--text-muted);">TOTAL REVENUE ACCRUED</div>
            <div style="font-size: 26px; font-weight: 800; color: #10b981;">₹${totalRev.toFixed(2)}</div>
          </div>
          <div class="card">
            <div style="font-size: 12px; color: var(--text-muted);">TOTAL SETTLED PAYMENTS</div>
            <div style="font-size: 26px; font-weight: 800; color: #60a5fa;">${store.payments.length} Payments</div>
          </div>
          <div class="card">
            <div style="font-size: 12px; color: var(--text-muted);">ORDER TYPES</div>
            <div style="font-size: 16px; font-weight: 700; margin-top: 6px;">
              ${store.orders.filter(o => o.order_type === 'DINE_IN').length} Dine-In • 
              ${store.orders.filter(o => o.order_type === 'TAKEAWAY').length} Takeaway
            </div>
          </div>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="padding: 16px; font-weight: 700; border-bottom: 1px solid var(--border-color);">Payment Settlements & Reference Audit</div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Payment ID</th>
                <th>Order #</th>
                <th>Amount</th>
                <th>Tip</th>
                <th>Method</th>
                <th>Status</th>
                <th>Txn Reference</th>
                <th>Timestamp</th>
              </tr>
            </thead>
            <tbody>
              ${store.payments.map(p => `
                <tr>
                  <td>#${p.id}</td>
                  <td>#${p.order_id}</td>
                  <td style="font-weight: 700; color: #10b981;">₹${p.amount.toFixed(2)}</td>
                  <td>₹${(p.tipAmount || 0).toFixed(2)}</td>
                  <td><span class="badge" style="background: var(--bg-input);">${p.method}</span></td>
                  <td><span class="badge badge-completed">${p.status}</span></td>
                  <td style="font-size: 12px; color: var(--text-muted);">${p.transactionReference || '—'}</td>
                  <td style="color: var(--text-muted); font-size: 12px;">${new Date(p.created_at).toLocaleString()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 9. USERS (Restricted to ADMIN & MANAGER)
    // =========================================================================
    function renderUsers(container, store, perms) {
      if (!perms.canManageUsers) {
        renderAccessDenied(container, 'users', store.activeRole);
        return;
      }

      container.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div>Staff Directory & Access Roles (Admin Management)</div>
          <button class="btn btn-primary btn-sm" onclick="promptAddUser()">➕ Add Staff Member</button>
        </div>
        <div class="card" style="padding: 0; overflow: hidden;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Assigned Role</th>
                <th>Active</th>
              </tr>
            </thead>
            <tbody>
              ${store.users.map(u => `
                <tr>
                  <td>#${u.id}</td>
                  <td style="font-weight: 600;">${u.name}</td>
                  <td>${u.email}</td>
                  <td>${u.phone || '—'}</td>
                  <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                  <td><span class="badge badge-available">${u.isActive ? 'Active' : 'Inactive'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function promptAddUser() {
      const store = getStore();
      const perms = ROLE_PERMISSIONS[store.activeRole];
      if (!perms.canManageUsers) {
        showToast('Permission denied: Only Admin can create users.', 'error');
        return;
      }
      const name = prompt('Staff Member Name:');
      if (!name) return;
      const email = prompt('Email Address:', name.toLowerCase().replace(/\s+/g, '') + '@restropos.com');
      const role = prompt('Assign Role (ADMIN, MANAGER, WAITER, CHEF, CASHIER):', 'WAITER').toUpperCase();
      if (!['ADMIN', 'MANAGER', 'WAITER', 'CHEF', 'CASHIER'].includes(role)) {
        showToast('Invalid role specified.', 'error');
        return;
      }

      store.users.push({
        id: store.users.length + 1,
        name,
        email,
        phone: '+91 98765 00000',
        role,
        isActive: true,
        createdAt: new Date().toISOString()
      });
      saveStore(store);
      showToast(`User ${name} created with role ${role}!`, 'success');
      renderCurrentPage();
    }

    // Initialize on load
    window.onload = function () {
      updateRoleUI();
    };
  </script>
</body>

</html>
